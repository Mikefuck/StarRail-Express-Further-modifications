plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = "https://maven.aliyun.com/repository/public/" }
    maven { url = "https://maven.ladysnake.org/releases" }
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://api.modrinth.com/maven" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
    maven { url = "https://maven.uuid.gg/releases" }
    maven { url = "https://maven.bawnorton.com/releases" }
    maven {
        name = "KosmX Maven"
        url = "https://maven.kosmx.dev/"
    }
    flatDir { dirs "libs" }
}

loom {
    runs {
        s0Server {
            server()
            runDir ".verification/s0-20261106/runtime/development-server"
            vmArgs "-Dmixin.debug.export=true", "-Dmixin.debug.export.decompile=false",
                    "-Dmixin.debug.verbose=true"
        }
        s0Client {
            client()
            runDir ".verification/s0-20261106/runtime/development-client"
            vmArgs "-Dmixin.debug.export=true", "-Dmixin.debug.export.decompile=false",
                    "-Dmixin.debug.verbose=true"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modCompileOnly "com.terraformersmc:modmenu:11.0.3"
    modLocalRuntime "com.terraformersmc:modmenu:11.0.3"
    include modImplementation("dev.kosmx.player-anim:player-animation-lib-fabric:2.0.4+1.21.1")
    // 开发环境必须使用上游的 named dev JAR；成品 intermediary JAR 在 Loom 中会漏映射
    // 继承的静态方法调用（例如 Block.simpleCodec），导致 runClient NoSuchMethodError。
    implementation files("libs/star_rail_express-4.3.0-dev.jar")
    // SRE 的硬依赖必须进入开发运行时；仅 compileOnly 会让 runClient 在
    // Fabric 依赖解析阶段直接退出。
    modImplementation files("libs/wathe-1.3.2.jar")
    modImplementation files("libs/ratatouille-1.4.3-1.21.1.jar")
    modImplementation files("libs/fabric-carpet-1.21-1.4.147+v240613.jar")
    modImplementation files("libs/voicechat-fabric-1.21.1-2.6.18.jar")
    modImplementation files("libs/sre-lib-1.0.3.jar")
    modImplementation files("libs/exposure-fabric-1.21.1-1.9.11.jar")
    modImplementation files("libs/ForgeConfigAPIPort-v21.1.6-1.21.1-Fabric.jar")
    modImplementation files("libs/architectury-13.0.11-fabric.jar")
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-base:6.1.3"
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-entity:6.1.3"
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-world:6.1.3"
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-scoreboard:6.1.3"
    modImplementation("me.shedaniel.cloth:cloth-config-fabric:15.0.140") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    // SRE 4.3.0 的玩家扩展接口直接继承 DataSyncPlayerExt，但其 fabric.mod.json
    // 未声明该硬依赖；缺少时会在 Minecraft 主类加载阶段 NoClassDefFoundError。
    modImplementation "dev.upcraft.datasync:datasync-minecraft-1.21.1-fabric:0.10.2"
    // SRE 的 wathe_blocker mixin 使用 @MixinSquared:Handler 动态选择器。
    modImplementation "com.github.bawnorton.mixinsquared:mixinsquared-fabric:0.3.7-beta.1"
    localRuntime "com.zaxxer:HikariCP:5.1.0"
    localRuntime "com.github.promeg:tinypinyin:2.0.3"
    localRuntime "com.electronwill.night-config:core:3.8.1"
    localRuntime "com.electronwill.night-config:toml:3.8.1"

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.0"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

afterEvaluate {
    configurations.testCompileClasspath.extendsFrom(
            configurations.getByName("minecraftNamedCompile")
    )
    configurations.testRuntimeClasspath.extendsFrom(
            configurations.getByName("minecraftNamedRuntime")
    )
}

// Keep the Windows ASCII-path workaround, but never Sync over another checkout's tests.
def testWorkspaceKey = java.security.MessageDigest.getInstance("SHA-256")
        .digest(rootProject.projectDir.canonicalPath.getBytes("UTF-8"))
        .encodeHex().toString().substring(0, 24)
def stagedTestRuntimeDir = new File(gradle.gradleUserHomeDir, "habitrain-core-test-runtime/${testWorkspaceKey}")

tasks.withType(Test).configureEach {
    systemProperty "file.encoding", "UTF-8"
    systemProperty "habitrain.test.configDir", layout.buildDirectory.dir("test-config/${name}").get().asFile.absolutePath
}

tasks.withType(org.gradle.language.jvm.tasks.ProcessResources).configureEach {
    filteringCharset = "UTF-8"
}

tasks.register("stageTestRuntime", Sync) {
    dependsOn(tasks.named("testClasses"))
    into(stagedTestRuntimeDir)
    from(sourceSets.test.output.classesDirs) {
        into("test")
    }
    // 测试资源（junit-platform.properties / META-INF/services）必须一起进暂存目录，
    // 否则 JUnit 的自动扩展发现机制在 Windows 暂存 classpath 上失效（审核 A2 的测试装配器依赖它）。
    def testResources = sourceSets.test.output.resourcesDir
    if (testResources != null) {
        from(testResources) {
            into("test")
        }
    }
    from(sourceSets.main.output) {
        into("main")
    }
    from(configurations.testRuntimeClasspath) {
        into("libs")
    }
}

test {
    useJUnitPlatform()
    // Real ItemStack tests need a fresh Minecraft bootstrap, isolated from registry mocks.
    exclude("**/GreedPouchItemTest.class")
    exclude("**/ReplacementRoleBootstrapTest.class")
    exclude("**/ApiRuntimeRegressionTest.class")
    exclude("**/ProviderConstructorFailureTest.class")
    exclude("**/SnakeFruitRuntimeTest.class")
    dependsOn(tasks.named("stageTestRuntime"))
    // Gradle's Windows test worker corrupts non-ASCII classpath entries.
    // Stage classes and resolved jars under Gradle home before forking it.
    testClassesDirs = files(new File(stagedTestRuntimeDir, "test"))
    classpath = files(
            new File(stagedTestRuntimeDir, "test"),
            new File(stagedTestRuntimeDir, "main")
    ) + fileTree(new File(stagedTestRuntimeDir, "libs")) {
        include("*.jar")
    }
}

tasks.register("greedPouchTest", Test) {
    useJUnitPlatform()
    dependsOn(tasks.named("stageTestRuntime"))
    testClassesDirs = tasks.named("test").get().testClassesDirs
    classpath = tasks.named("test").get().classpath
    include("**/GreedPouchItemTest.class")
}

tasks.register("replacementRoleBootstrapTest", Test) {
    useJUnitPlatform()
    dependsOn(tasks.named("stageTestRuntime"))
    testClassesDirs = tasks.named("test").get().testClassesDirs
    classpath = tasks.named("test").get().classpath
    include("**/ReplacementRoleBootstrapTest.class")
}

tasks.named("check") {
    dependsOn(tasks.named("greedPouchTest"))
    dependsOn(tasks.named("replacementRoleBootstrapTest"))
    dependsOn(tasks.named("apiRuntimeRegressionTest"))
}

tasks.register("apiRuntimeRegressionTest", Test) {
    useJUnitPlatform()
    // Each real Minecraft bootstrap gets its own JVM, including separate static registries.
    forkEvery = 1
    dependsOn(tasks.named("stageTestRuntime"))
    testClassesDirs = tasks.named("test").get().testClassesDirs
    classpath = tasks.named("test").get().classpath
    include("**/ApiRuntimeRegressionTest.class")
    include("**/ProviderConstructorFailureTest.class")
    include("**/SnakeFruitRuntimeTest.class")
}

// `test` is the normal verification entry point as well as `build`/`check`.
// Keep real bootstraps in separate workers instead of silently excluding them.
tasks.named("test") {
    dependsOn("greedPouchTest", "replacementRoleBootstrapTest", "apiRuntimeRegressionTest")
}

processResources {
    def version = project.version
    inputs.property "version", version
    filesMatching("fabric.mod.json") {
        expand "version": version
    }
    // 审核 D-12：项目根的 assets/（上游 starrailexpress 的语言覆盖，2666 行）不在
    // src/main/resources 下，之前 build.gradle 也没有额外 srcDir，导致该翻译永远不进 jar。
    // 这里按原路径打进 jar：assets/starrailexpress/lang/*.json。
    from("assets") {
        into("assets")
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

java {
    withSourcesJar()
    tasks.withType(Javadoc).configureEach { options.encoding = "UTF-8" }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

def releaseArchiveBaseName = project.archives_base_name
def releaseVersion = project.version.toString()

jar {
    from("LICENSE") { rename { "${it}_${releaseArchiveBaseName}" } }
}

// 先在 build 内暂存，完整构建成功后再把带 restored 后缀的 JAR 交付到父目录。
// 不能把 Copy 任务的输出目录设成项目父目录，否则 Gradle 9 会把整个项目误判为任务输出。
def releaseOutputDir = layout.buildDirectory.dir("release")

tasks.register("copyReleaseJar", Copy) {
    dependsOn(tasks.named("remapJar"))
    from(tasks.named("remapJar").flatMap { it.archiveFile })
    into(releaseOutputDir)
    rename { "${releaseArchiveBaseName}-${releaseVersion}-restored.jar" }
}

tasks.named("assemble") {
    dependsOn(tasks.named("copyReleaseJar"))
}

publishing {
    publications { create("mavenJava", MavenPublication) { from components.java } }
    repositories { mavenLocal() }
}

// Production evidence only: this task never launches Minecraft or treats missing exports as a pass.
tasks.register("verifyProductionMixins", JavaExec) {
    dependsOn(tasks.named("stageTestRuntime"), tasks.named("remapJar"))
    classpath = tasks.named("test").get().classpath
    mainClass = "com.habitrain.core.verification.ProductionMixinVerifier"
    doFirst {
        def runtimeDir = providers.gradleProperty("s0RuntimeDir").orNull
        if (runtimeDir == null) throw new GradleException("Supply -Ps0RuntimeDir=<isolated run directory>")
        args(tasks.named("remapJar").get().archiveFile.get().asFile.absolutePath, file(runtimeDir).absolutePath)
    }
}
